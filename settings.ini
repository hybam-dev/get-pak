[client_folder]
inputs = /path/to/GRS
output = /path/to/output
wmask_folder = /path/to/water_masks

[vector_list]
roi_vectors = /path/to/shp/liangzi_lake_epsg32650.shp

[processing]
ac_processor = GRS
# options are: GRS or ACOLITE
compute_l2b = True
make_report = True
report_rrs = True
run_custom_equations = False
parallel = True
s2_tile = 50RKU
s2_resolution = 20
grs_version = v20
# grs_version options:
# v15, v20 (default) or v21 
# grs_version is ignored when ac_processor = ACOLITE

[timeseries]
l2b_algorithms = [
    # 'CDOM_Brezonik',
    ]

[output_encoding]
encoding_version = GETPAK-ENC-2
rrs_multiplier = 10000
chla_multiplier = 100
turbidity_multiplier = 10
hyspm_multiplier = 10
continuous_dtype = uint16
continuous_nodata = 65535
categorical_dtype = uint8
categorical_nodata = 255

[custom_equations]
# Registered Python functions selected by name; computation remains off above until enabled.
enabled = ['example_equation_01', 'example_equation_02']
# Coefficients use <registered_id>.<coefficient> = <finite scalar>.
# example_equation_02.a = 0
# example_equation_02.b = 1
# example_equation_02.c = 1
